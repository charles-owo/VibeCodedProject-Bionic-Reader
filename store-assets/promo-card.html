<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 440px;
    height: 280px;
    background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #31104b 100%);
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 24px;
    position: relative;
    overflow: hidden;
  }
  .glow {
    position: absolute;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, rgba(0,0,0,0) 70%);
    top: -50px;
    left: 70px;
    pointer-events: none;
  }
  .logo {
    width: 64px;
    height: 64px;
    margin-bottom: 12px;
    border-radius: 14px;
    box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
  }
  h1 {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.5px;
    margin-bottom: 6px;
    color: #ffffff;
  }
  .tagline {
    font-size: 13px;
    color: #c7d2fe;
    margin-bottom: 16px;
    max-width: 340px;
    line-height: 1.4;
  }
  .preview {
    font-size: 14px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    padding: 8px 16px;
    border-radius: 999px;
    color: #e2e8f0;
  }
  .b { font-weight: 800; color: #ffffff; -webkit-text-stroke: 0.35px currentColor; }
  .r { font-weight: 400; opacity: 0.65; }
</style>
</head>
<body>
  <div class="glow"></div>
  <img src="../bionic-reader/icons/icon-128.png" class="logo">
  <h1>Bionic Reader</h1>
  <p class="tagline">Speed Reading Assistant &amp; Focus Guide for any webpage</p>
  <div class="preview">
    <span class="b">Rea</span><span class="r">d</span>
    <span class="b">fas</span><span class="r">ter</span>,
    <span class="b">foc</span><span class="r">us</span>
    <span class="b">dee</span><span class="r">ply</span>.
  </div>
</body>
</html>
